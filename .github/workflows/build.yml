name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk orders-offline.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest orders-offline.apk --title "orders offline" --notes "download and install orders-offline.apk"
      - uses: actions/upload-artifact@v4
        with: { name: orders-offline, path: app/build/outputs/apk/debug/app-debug.apk }
